openapi: 3.0.0
info:
  title: Local Project Management Tool API
  version: 2.0.0
  description: API specification for the offline project management tool

paths:
  /settings:
    $ref: "./apis/openapi_settings.yaml#/paths/~1settings"
  /projects:
    $ref: "./apis/openapi_projects.yaml#/paths/~1projects"
  /projects/{project_name}/settings:
    $ref: "./apis/openapi_projects.yaml#/paths/~1projects~1{project_name}~1settings"
  /projects/{project_name}/undo:
    $ref: "./apis/openapi_projects.yaml#/paths/~1projects~1{project_name}~1undo"
  /projects/{project_name}/redo:
    $ref: "./apis/openapi_projects.yaml#/paths/~1projects~1{project_name}~1redo"
  /projects/{project_name}/tasks:
    $ref: "./apis/openapi_tasks.yaml#/paths/~1projects~1{project_name}~1tasks"
  /projects/{project_name}/tasks/{task_id}:
    $ref: "./apis/openapi_tasks.yaml#/paths/~1projects~1{project_name}~1tasks~1{task_id}"
  /projects/{project_name}/tasks/reorder:
    $ref: "./apis/openapi_tasks.yaml#/paths/~1projects~1{project_name}~1tasks~1reorder"
