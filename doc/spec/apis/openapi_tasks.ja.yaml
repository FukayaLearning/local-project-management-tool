paths:
  /tasks:
    get:
      summary: タスク一覧取得
      tags:
        - tasks
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Task"
    post:
      summary: タスク作成
      tags:
        - tasks
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskInput"
      responses:
        "201":
          description: 作成成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"

  /tasks/{id}:
    get:
      summary: タスク詳細取得
      tags:
        - tasks
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
    put:
      summary: タスク更新
      tags:
        - tasks
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskInput"
      responses:
        "200":
          description: 更新成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
    delete:
      summary: タスク削除
      tags:
        - tasks
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: 削除成功

  /tasks/undo:
    post:
      summary: 直前の変更を取り消す
      tags:
        - tasks
      responses:
        "200":
          description: 取り消し成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
  /tasks/redo:
    post:
      summary: 取り消した変更をやり直す
      tags:
        - tasks
      responses:
        "200":
          description: やり直し成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string

components:
  schemas:
    TaskBase:
      type: object
      properties:
        title:
          type: string
        status:
          type: string
        assignee_id:
          type: string
          nullable: true
        start_date:
          type: string
          format: date
          nullable: true
        due_date:
          type: string
          format: date
          nullable: true
        parent_id:
          type: string
          nullable: true

    TaskInput:
      allOf:
        - $ref: "#/components/schemas/TaskBase"
      required:
        - title
        - status

    Task:
      allOf:
        - $ref: "#/components/schemas/TaskBase"
        - type: object
          properties:
            id:
              type: string
              format: uuid
          required:
            - id
