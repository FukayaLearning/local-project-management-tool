paths:
  /system/status:
    get:
      summary: Get System Status
      description: Retrieves system initialization status and project info. Detects manual file changes during startup or upon call, and automatically commits them to Git.
      operationId: getSystemStatus
      tags:
        - system
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemStatus"

components:
  schemas:
    SystemStatus:
      type: object
      properties:
        is_git_initialized:
          type: boolean
        has_default_project:
          type: boolean
        current_project:
          type: string
          nullable: true
      required:
        - is_git_initialized
        - has_default_project
