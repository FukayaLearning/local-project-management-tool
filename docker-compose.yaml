services:
  proxy:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx.dev.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - backend
      - frontend

  backend:
    build: ./backend
    ports:
      - "8000:8000" # Internal only via proxy
    volumes:
      - ./backend/data:/workspace/backend/data
    tty: true

  frontend:
    build:
      context: ./frontend
      target: dev
    ports:
      - "3000:5173" # Internal only via proxy
    environment:
      - VITE_API_BASE_URL=/api/v1
    tty: true
